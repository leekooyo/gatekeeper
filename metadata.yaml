name: gatekeeper
display_name: 总控闸门
short_desc: 按群控制机器人发言与插件使用权限（4 模式 · 纯运行时水闸 · 被禁言自动静默）
desc: >-
  每群 4 模式的总控闸门：mute 全禁 / llm 只聊天 / plugin 只插件 / both 全开。
  原 astrbot_plugin_llm_gate 的「群聊 @bot 概率闸门」已并入本插件（见 probability 配置项）。
  运行时水闸：不改 AstrBot 的全局会话配置；群策略和临时禁言状态保存在插件数据中。
  不在策略里的群按默认 plugin（LLM 关、插件开）；私聊一律放行并作为主人管理入口。

  被禁言自动 mute：bot 在某个群被禁言（个人禁言或全体禁言）时，自动把该群切到 mute，
  到期后约 1 分钟或手动解除时恢复原模式，并向配置的管理员渠道通知。
  即使群通知偶发漏送，仍以轮询拉取的真实状态为准；notice 只作加速器，
  不依赖事件里的 sub_type / duration。核心保留普通自发消息过滤，但允许自身 notice 派发。

  提供聊天指令与 WebUI 管理页；自身 notice 派发依赖本机的核心事件过滤修正。

  0.4.0：新增只读状态快照 get_status_snapshot()，把既有策略与观测元数据解释成
  群模式 / 限制阶段 / 观测时间，供 status 插件读取；不新增任何平台请求，
  不带清理、通知或写盘副作用。
version: 0.4.0
author: "leekooyo"
astrbot_version: "==4.28.2"
repo: https://github.com/leekooyo/gatekeeper
